project: monorepo-controller

files:
  backend-api-services/src/main.ts:
    purpose: Bootstrap the Nest HTTP application and record startup logs.
    functions: [bootstrap]
  backend-api-services/src/app.module.ts:
    purpose: Register controller, logging, repository data, and task runner services.
    classes: [AppModule]
  backend-api-services/src/contracts.ts:
    purpose: Define shared REST payloads for tasks, planned task metadata, agents, skills, workflows, memory, logs, and messages.
    types: [TaskStatus, TaskEvent, TaskRecord, CreateTaskRequest, AgentSummary, SkillSummary, CreateSkillRequest, WorkflowSummary, MemoryEntry, WorkLog, MessageRecordPayload, OperationalErrorRecord, CreateMessageRequest, MessagingSummary, MessagingSnapshot, ControllerSnapshot, ApplicationLogLevel, RuntimeLogRequest]
  backend-api-services/src/project-paths.ts:
    purpose: Resolve the monorepo root and enforce safe backend path handling.
    functions: [findProjectRoot, safeJoin, asRecord, asStringArray]
  backend-api-services/src/monorepo-data.service.ts:
    purpose: Read and write repository-backed controller state from YAML files, planned task manifests, RuntimeEvent artifacts, memory records, message records, and operational error records.
    classes:
      MonorepoDataService:
        functions: [snapshot, agents, skills, addSkill, workflows, tasks, createTask, sendMessage, messaging, messageThread, memory, workLogs]
        function_summary: Exposes the monorepo control plane as structured API-ready collections and writes task/message/skill mutations while projecting planned tasks into the task list.
  backend-api-services/src/task-runner.service.ts:
    purpose: Launch Python runtime task execution and message-hub dispatches from controller actions.
    classes:
      TaskRunnerService:
        functions: [launch, runHubOnce]
        function_summary: Starts detached Python processes after messages are durably queued.
  backend-api-services/src/controller.controller.ts:
    purpose: Expose repository-backed controller REST endpoints.
    classes:
      ControllerController:
        functions: [snapshot, agents, skills, addSkill, workflows, tasks, createTask, memory, workLogs, messaging, sendMessage, messageThread]
        function_summary: Maps controller HTTP requests to data and runner services.
  backend-api-services/src/application-log.service.ts:
    purpose: Persist application runtime logs to daily .agent-state system log files.
    classes:
      ApplicationLogService:
        functions: [writeLog, writeBackendLog, record, timestamp, level, message, fileName, text, limit, errorMessage]
        function_summary: Normalize incoming log payloads and append lines using the shared runtime-log format.
  backend-api-services/src/application-logs.controller.ts:
    purpose: Accept browser runtime log payloads from Angular.
    classes:
      ApplicationLogsController:
        functions: [browserLog]
        function_summary: Save browser console, runtime, fetch, and XHR logs through ApplicationLogService.
  src/main.ts:
    purpose: Bootstrap the standalone Angular application and install browser runtime logging.
    functions: []
  src/app/app.component.ts:
    purpose: Compose the header and routed workspace.
    classes: [AppComponent]
  src/app/app.routes.ts:
    purpose: Define controller navigation routes without the removed Codex chat client.
    functions: []
  src/app/shared-services/interfaces.ts:
    purpose: Define UI and controller API data contracts, including planned task and operational error metadata.
    types: [TaskStatus, TaskEvent, Task, Agent, Skill, WorkflowStep, Workflow, MemoryEntry, WorkLog, MessageRecord, OperationalErrorRecord, MessagingSummary, MessagingSnapshot, ControllerSnapshot, CreateTaskRequest, CreateSkillRequest, CreateMessageRequest]
  src/app/shared-services/backend-url.ts:
    purpose: Define the backend API base URL used by Angular services.
    functions: []
  src/app/shared-services/browser-logging.service.ts:
    purpose: Capture browser console, runtime, fetch, and XHR logs and send them to the backend.
    classes:
      BrowserLoggingService:
        functions: [install, debug, info, warn, error, captureError, describeError, patchConsole, captureWindowErrors, patchFetch, patchXmlHttpRequest, send, requestUrl, absoluteUrl, isLogEndpoint, duration, serializeConsoleArguments, serializeValue, limit]
        function_summary: Installs browser logging hooks once and forwards normalized log payloads to the sys-logs API endpoint.
  src/app/shared-services/browser-error-handler.ts:
    purpose: Report Angular framework errors through BrowserLoggingService.
    classes:
      BrowserErrorHandler:
        functions: [handleError]
  src/app/shared-services/http.service.ts:
    purpose: Call the repository-backed controller REST API.
    classes:
      HttpService:
        functions: [snapshot, tasks, createTask, agents, skills, addSkill, workflows, memory, workLogs, messaging, sendMessage, messageThread]
  src/app/shared-services/store.service.ts:
    purpose: Hold controller collection state, selected identifiers, mutation helpers, and snapshot refresh.
    classes:
      StoreService:
        functions: [selectTask, selectAgent, selectSkill, refresh, createTask, addSkill, sendMessage]
        function_summary: Loads snapshots, polls quietly for completion updates, and applies task/skill/message mutations.
  src/app/components/agent-card/agent-card.component.ts:
    purpose: Render a compact agent card.
    classes: [AgentCardComponent]
  src/app/components/agents-view/agents-view.component.ts:
    purpose: Render agent directory, selected agent metadata, skills, tools, history, and performance.
    classes:
      AgentsViewComponent:
        functions: [select, isSelected]
  src/app/components/header/header.component.ts:
    purpose: Render and draw the controller navigation header.
    classes:
      HeaderComponent:
        functions: [ngAfterViewInit, navigate, selected, toggle, closeMenus]
  src/app/components/memory-view/memory-view.component.ts:
    purpose: Render filterable runtime-memory records.
    classes: [MemoryViewComponent]
  src/app/components/messaging-portal/messaging-portal.component.ts:
    purpose: Render message summaries, message records, queue state, and message send/debug forms.
    classes:
      MessagingPortalComponent:
        functions: [sendMessage, sendDebugRequest]
  src/app/components/skill-card/skill-card.component.ts:
    purpose: Render a compact skill card.
    classes: [SkillCardComponent]
  src/app/components/skills-view/skills-view.component.ts:
    purpose: Render skill directory, skill content, assignment metadata, and create-skill form.
    classes:
      SkillsViewComponent:
        functions: [select, isSelected, toggleAgent, addSkill]
  src/app/components/task-card/task-card.component.ts:
    purpose: Render a compact task card.
    classes: [TaskCardComponent]
  src/app/components/task-detail/task-detail.component.ts:
    purpose: Render selected task details for legacy task-detail composition.
    classes:
      TaskDetailComponent:
        functions: [toggleEdit, setPlan]
  src/app/components/task-thread/task-thread.component.ts:
    purpose: Render live task columns, planned task details, task assignment, and generated task events.
    classes:
      TaskThreadComponent:
        functions: [ngOnInit, choose, isSelected, createTask, relatedMessages, eventDetail]
  src/app/components/work-logs-view/work-logs-view.component.ts:
    purpose: Render filterable runtime and messaging work logs.
    classes: [WorkLogsViewComponent]
  src/app/components/workflows-view/workflows-view.component.ts:
    purpose: Render workflow summaries and resolved step lists.
    classes:
      WorkflowsViewComponent:
        functions: [select]
