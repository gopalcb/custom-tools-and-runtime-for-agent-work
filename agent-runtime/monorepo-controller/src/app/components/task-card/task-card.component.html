<button class="task-card" [class.selected]="selected()" type="button" (click)="taskSelected.emit(task().id)"><div class="task-top"><span class="status" [class]="'status status-' + task().status.replace(' ','-')">@if (task().status === 'implementing') { <span class="spinner"></span> } {{ task().status }}</span><span class="task-id">{{ task().id }}</span></div><h3>{{ task().title }}</h3><p>{{ task().summary }}</p><div class="metadata">@if (task().label) { <span class="task-label">{{ task().label }}</span> }<span>{{ task().date }}</span><span>{{ task().tokens | number }} tokens</span><span>{{ task().duration }}</span></div></button>
