<button class="agent-card" [class.selected]="selected()" type="button" (click)="agentSelected.emit(agent().id)"><span class="agent-avatar">{{ agent().name.charAt(0) }}</span><span><strong>{{ agent().name }}</strong><small>{{ agent().role }}</small></span><i class="status-dot" [class.busy]="agent().status === 'implementing'" [class.queued]="agent().status === 'queued'"></i></button>
