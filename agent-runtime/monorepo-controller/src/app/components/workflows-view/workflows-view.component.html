<section class="collection-page"><nav class="view-tabs" aria-label="Workflow views"><button type="button" [class.active]="activeTab() === 'available'" (click)="activeTab.set('available')">Available workflows</button><button type="button" [class.active]="activeTab() === 'build'" (click)="activeTab.set('build')">Build workflow</button></nav>@if (activeTab() === 'available') { <div class="page-heading"><div><h2 class="section-title">Workflows</h2><p class="subcopy">Declarative paths that coordinate agents and durable runtime state.</p></div></div><div class="collection-grid">@for(item of store.workflows();track item.name){<article class="collection-card panel"><div class="card-top"><span class="mini-status">{{item.status}}</span><span class="muted">{{item.runs}}</span></div><h3>{{item.name}}</h3><p>{{item.description}}</p><footer><span>{{item.owner}}</span><span>→</span></footer></article>}</div> } @else { <div class="blank-tab"></div> }</section>
