<section class="collection-page"><nav class="view-tabs" aria-label="Work log views"><button type="button" [class.active]="activeTab() === 'all'" (click)="activeTab.set('all')">Activity</button><button type="button" [class.active]="activeTab() === 'runtime'" (click)="activeTab.set('runtime')">Runtime events</button><button type="button" [class.active]="activeTab() === 'messaging'" (click)="activeTab.set('messaging')">Messaging</button><button type="button" [class.active]="activeTab() === 'issues'" (click)="activeTab.set('issues')">Issues</button></nav><div class="page-heading"><div><h2 class="section-title">Work logs</h2><p class="subcopy">Runtime and message facts projected by the backend API.</p></div><span class="count-badge">{{ logs().length }} events</span></div><div class="logs panel">@for(log of logs();track log.id){<div class="log-row"><time>{{log.date}}</time><span class="log-line"></span><div><strong>{{log.event}}</strong><span class="log-agent">{{log.agent}}</span><p>{{log.detail}}</p>@if(log.path){<small>{{log.path}}</small>}</div></div>}@if(!logs().length){<div class="empty-state">No matching work logs</div>}</div></section>
