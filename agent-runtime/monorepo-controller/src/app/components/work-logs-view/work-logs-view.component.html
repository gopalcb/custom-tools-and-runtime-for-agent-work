<section class="collection-page"><nav class="view-tabs" aria-label="Work log views"><button type="button" [class.active]="activeTab() === 'activity'" (click)="activeTab.set('activity')">Activity</button><button type="button" [class.active]="activeTab() === 'runtime'" (click)="activeTab.set('runtime')">Runtime events</button><button type="button" [class.active]="activeTab() === 'persistence'" (click)="activeTab.set('persistence')">Persistence</button></nav>@if (activeTab() === 'activity') { <div class="page-heading"><div><h2 class="section-title">Work logs</h2><p class="subcopy">A compact timeline of durable runtime events and operator-visible activity.</p></div></div><div class="logs panel">@for(log of store.workLogs();track log.date){<div class="log-row"><time>{{log.date}}</time><span class="log-line"></span><div><strong>{{log.event}}</strong><span class="log-agent">{{log.agent}}</span><p>{{log.detail}}</p></div></div>}</div> } @else { <div class="blank-tab"></div> }</section>
