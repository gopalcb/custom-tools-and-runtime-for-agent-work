<section class="directory-page"><div class="page-heading"><div><p class="eyebrow">Library / capabilities</p><h2 class="section-title">Skills</h2><p class="subcopy">Read the capabilities available to the monorepo agents.</p></div><span class="count-badge">{{store.skills().length}} skills</span></div><div class="skills-layout"><div class="skill-list">@for(skill of store.skills();track skill.id){<app-skill-card [skill]="skill" [selected]="skill.id===store.selectedSkillId()" (skillSelected)="select($event)"/>}</div>@if(selected();as skill){<article class="skill-content panel"><p class="eyebrow">Read only content</p><h2>{{skill.name}}</h2><p class="skill-summary">{{skill.summary}}</p><pre>{{skill.content}}</pre></article>}@else{<div class="panel empty-state">Loading skills…</div>}</div></section>
