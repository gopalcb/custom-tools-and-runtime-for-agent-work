<section class="collection-page"><nav class="view-tabs" aria-label="Memory views"><button type="button" [class.active]="activeTab() === 'short-term'" (click)="activeTab.set('short-term')">Short-term memory</button><button type="button" [class.active]="activeTab() === 'vector'" (click)="activeTab.set('vector')">Vector memory</button><button type="button" [class.active]="activeTab() === 'episodic'" (click)="activeTab.set('episodic')">Episodic memory</button></nav>@if (activeTab() === 'short-term') { <div class="page-heading"><div><h2 class="section-title">Memory system</h2><p class="subcopy">Verified decisions and patterns available to future runtime work.</p></div></div><div class="memory-list">@for(item of store.memory();track item.title){<article class="memory-card panel"><div class="memory-icon">◆</div><div><div class="memory-meta"><span>{{item.kind}}</span><time>{{item.updated}}</time></div><h3>{{item.title}}</h3><p>{{item.excerpt}}</p></div></article>}</div> } @else { <div class="blank-tab"></div> }</section>
