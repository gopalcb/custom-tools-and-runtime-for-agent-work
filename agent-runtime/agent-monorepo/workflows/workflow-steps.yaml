version: 1

# Reusable step catalog. workflow-orchestrator.yaml composes these steps by ref.
steps:
  analyze:
    id: analyze
    name: Analyze user query
    uses: hook
    hook: analyze_query

  resolve-context:
    id: resolve-context
    name: Resolve project context
    uses: tool
    tool: project_context
    depends_on:
      - analyze
    timeout: 60

  web-research:
    id: web-research
    name: Research external sources for planning
    uses: tool
    tool: web_search
    agent: agent-implementation-planner
    when: needs_web_search
    depends_on:
      - resolve-context
    retry:
      max_attempts: 2
    timeout: 180

  plan:
    id: plan
    name: Plan work and select an execution workflow
    uses: agent
    agent: agent-implementation-planner
    depends_on:
      - resolve-context
      - web-research
    timeout: 300

  execute:
    id: execute
    name: Execute planned changes
    uses: agent
    agent: $resolved_agent
    timeout: 1800

  validate:
    id: validate
    name: Validate implementation
    uses: parallel
    depends_on:
      - execute
    timeout: 600
    tasks:
      - id: typecheck
        name: Compile Python sources
        uses: shell
        command: $validation.typecheck
      - id: tests
        name: Run tests
        uses: shell
        command: $validation.tests

  finalize:
    id: finalize
    name: Post-implementation work
    uses: hook
    hook: post_completion
    timeout: 60

  design:
    id: design
    name: Design agent
    uses: agent
    agent: agent-builder
    timeout: 1800

  ui:
    id: ui
    name: Generate UI mockup
    uses: agent
    agent: agent-ui-builder
    when: needs_ui
    depends_on:
      - design
    timeout: 900

  agent-validate:
    id: agent-validate
    name: Validate generated agent
    uses: shell
    command: $validation.agent
    depends_on:
      - design
      - ui
    timeout: 300
