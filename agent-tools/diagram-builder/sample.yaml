title: Codex Agent Architecture Components
subtitle: Declarative examples for reusable flow, tree, and event hub diagrams.
diagrams:
  - type: flow
    title: Agent routing flow
    steps:
      - component: label-upper
        text: USER PROMPT
      - component: down-arrow
      - component: label-normal
        text: Agent Resolver
      - component: down-arrow-with-right-branches
        branches:
          - determine owner
      - component: label-lower
        text: frontend-developer
      - component: down-arrow
      - component: label-upper
        text: CODEX SKILL SELECTION
      - component: down-arrow-with-right-branches
        branches:
          - angular-development
          - api-integration
          - ui-design-rules
          - browser-validation

  - type: tree
    title: Repository tree
    root:
      name: monorepo/
      children:
        - name: AGENTS.md
        - name: ARCHITECTURE.md
        - name: code-map.yaml
        - name: .agents/
          children:
            - name: skills/
              children:
                - name: ui-design-rules/
                  children:
                    - name: SKILL.md
                - name: angular-development/

  - type: event_bus
    title: Runtime event pipeline
    runtime: Agent Runtime
    sources:
      - model events
      - tool events
      - workflow events
    hub: EventHub
    outputs:
      - name: events.jsonl
      - name: live subscribers
        child: Codex Agent Console
    post_completion:
      name: PostCompletion
      artifacts:
        - run.json
        - summary.md
        - metrics
      metric_child: memory candidates
