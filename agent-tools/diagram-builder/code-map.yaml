project: diagram-builder
files:
  diagram_builder.py:
    purpose: CLI renderer that converts declarative YAML diagrams into HTML.
    functions:
      load_yaml:
        summary: Load a YAML mapping from disk.
      load_component_catalog:
        summary: Load reusable component definitions.
      validate_document:
        summary: Validate supported diagram payload shapes and component names.
      validate_tree_node:
        summary: Validate one tree node and its descendants.
      render_label:
        summary: Render a catalog-backed label component.
      render_connector:
        summary: Render down-arrow connectors with optional branches.
      render_flow:
        summary: Render a vertical flow diagram.
      render_tree_node:
        summary: Render one recursive tree node.
      render_tree:
        summary: Render a repository-style tree diagram.
      render_event_bus:
        summary: Render a runtime event bus architecture diagram.
      distribute_positions:
        summary: Distribute node x positions across a bounded horizontal range.
      render_positioned_node:
        summary: Render an absolutely positioned event bus node.
      render_positioned_caption:
        summary: Render an absolutely positioned event bus caption.
      render_positioned_output:
        summary: Render one positioned event bus output and optional child subscriber.
      render_event_bus_connectors:
        summary: Render connector lines for the positioned event bus diagram.
      render_diagram:
        summary: Dispatch rendering for one diagram block.
      render_document:
        summary: Render a complete HTML page.
      build_parser:
        summary: Create the command-line parser.
      main:
        summary: Parse CLI arguments, render the document, and write HTML.
