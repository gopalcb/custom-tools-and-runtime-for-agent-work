project: internal-messaging
files:
  agents_internal_messaging/__init__.py:
    purpose: Export local messaging primitives for Codex agents.
    functions: {}
  agents_internal_messaging/models.py:
    purpose: Message and message-record data contracts.
    functions:
      utc_now_iso:
        summary: Return the current UTC timestamp.
      AgentMessage.to_dict:
        summary: Convert a message to durable JSON fields.
      AgentMessage.from_dict:
        summary: Build a message from durable JSON fields.
      MessageRecord.to_dict:
        summary: Convert a lifecycle record to durable JSON fields.
      MessageRecord.from_dict:
        summary: Build a lifecycle record from durable JSON fields.
  agents_internal_messaging/bus.py:
    purpose: Atomic file-backed message, task, operational error, manifest, and event persistence.
    functions:
      default_message_root:
        summary: Resolve the default repository-local messaging root.
      MessageBus.__init__:
        summary: Configure logging and create the durable messaging structure.
      MessageBus.inbox_dir:
        summary: Return the pending inbox directory for one agent.
      MessageBus.processed_dir:
        summary: Return the processed archive directory for one agent.
      MessageBus.failed_dir:
        summary: Return the failed archive directory for one agent.
      MessageBus.records_dir:
        summary: Return the durable records root.
      MessageBus.errors_dir:
        summary: Return the operational error archive directory.
      MessageBus.current_error_path:
        summary: Return the active operational error pointer path.
      MessageBus.message_records_dir:
        summary: Return the message record directory.
      MessageBus.task_records_dir:
        summary: Return the task record directory.
      MessageBus.event_log_path:
        summary: Return the append-only lifecycle event log path.
      MessageBus.manifest_path:
        summary: Return the messaging manifest path.
      MessageBus.ensure_structure:
        summary: Create messaging directories, the event log, and the manifest.
      MessageBus.send:
        summary: Write a message to an inbox and index it.
      MessageBus.pending:
        summary: List pending inbox JSON files for one agent.
      MessageBus.read:
        summary: Read a message file.
      MessageBus.mark_processed:
        summary: Move a message into the processed archive.
      MessageBus.mark_failed:
        summary: Move a message into the failed archive with an error note.
      MessageBus.write_task_record:
        summary: Persist one controller task record.
      MessageBus.read_task_record:
        summary: Load one controller task record by id.
      MessageBus.list_task_records:
        summary: List controller task records newest first.
      MessageBus.update_task_status:
        summary: Update task status and append a task event.
      MessageBus.record_error:
        summary: Store or update the active operational error and send the exact error object as a message.
      MessageBus.read_current_error:
        summary: Read the active operational error pointer.
      MessageBus.list_error_records:
        summary: List current and archived operational errors newest first.
      MessageBus.resolve_current_error:
        summary: Archive the current operational error after a confirmed fix.
      MessageBus.list_records:
        summary: List message lifecycle records with optional filters.
      MessageBus.read_record:
        summary: Read one message record by id.
      MessageBus.thread:
        summary: Return a message and its replies.
      MessageBus.summary:
        summary: Summarize messages, tasks, and the messaging root.
      MessageBus.read_events:
        summary: Read messaging events newest first.
      MessageBus._write_record:
        summary: Persist the current lifecycle record for one message.
      MessageBus._append_event:
        summary: Append one message lifecycle event.
      MessageBus._append_task_event:
        summary: Append one task lifecycle event.
      MessageBus._append_error_event:
        summary: Append one operational error lifecycle event.
      MessageBus._write_json:
        summary: Atomically write one JSON object.
      MessageBus._indexed_records:
        summary: Load indexed message records.
      MessageBus._scan_folder_records:
        summary: Recover visible records by scanning lifecycle folders.
      safe_filename:
        summary: Convert an error identifier to a conservative filename stem.
      error_fingerprint:
        summary: Build a stable fingerprint for an exact error object.
  agents_internal_messaging/cli.py:
    purpose: Agent-facing send, task, event, and inspection commands.
    functions:
      _payload:
        summary: Load a CLI payload from JSON text or a file.
      _details:
        summary: Load CLI resolution details from JSON text or a file.
      _record_dict:
        summary: Convert a message record for JSON CLI output.
      _print_records:
        summary: Print a compact table of message records.
      main:
        summary: Parse CLI commands and call the message bus.
  agents_internal_messaging/hub.py:
    purpose: Optional polling and UI debugger handler dispatch.
    functions:
      AgentHub.__init__:
        summary: Create a hub around a message bus.
      AgentHub.register:
        summary: Register a handler for a recipient and message type.
      AgentHub.run_once:
        summary: Process pending messages for registered handlers once.
      AgentHub.listen:
        summary: Poll and dispatch messages continuously.
      AgentHub._reply:
        summary: Send a result reply back to the requester.
      handle_ui_debug_request:
        summary: Run one Selenium UI debug request and return compact artifact metadata.
      _compact_summary:
        summary: Trim a UI debug summary for reply messages.
      build_default_hub:
        summary: Build the default hub with UI debugger handlers.
      main:
        summary: Parse CLI commands and run the hub.
  agents_internal_messaging/logging_config.py:
    purpose: Configure Python diagnostics under .agent-state/logs/system/messaging.
    functions:
      configure_messaging_logging:
        summary: Configure package logging and return the active log path.
