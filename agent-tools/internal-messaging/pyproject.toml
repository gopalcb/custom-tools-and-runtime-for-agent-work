[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-internal-messaging"
version = "0.2.0"
description = "Local file-backed messaging for monorepo agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-msg = "agents_internal_messaging.cli:main"
agent-hub = "agents_internal_messaging.hub:main"

[tool.setuptools.packages.find]
where = ["src"]
