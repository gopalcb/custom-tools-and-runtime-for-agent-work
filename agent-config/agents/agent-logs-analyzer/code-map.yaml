project: agent-logs-analyzer
files:
  log_analyzer.py:
    purpose: Watch .agent-state system logs for ERROR lines and hand exact error objects to internal messaging.
    functions:
      LogAnalyzer.__post_init__:
        summary: Normalize paths and create thread controls.
      LogAnalyzer.start:
        summary: Start the analyzer thread when it is not already alive.
      LogAnalyzer.prepare:
        summary: Create analyzer directories and position existing logs at EOF.
      LogAnalyzer.is_running:
        summary: Report whether the analyzer thread is alive.
      LogAnalyzer.stop:
        summary: Stop the analyzer thread.
      LogAnalyzer.run:
        summary: Tail system logs until stopped or the project root disappears.
      LogAnalyzer.scan_once:
        summary: Scan tracked log files for new ERROR lines.
      LogAnalyzer.discover_log_files:
        summary: Add current system log files and initialize read offsets.
      LogAnalyzer.read_new_lines:
        summary: Read new lines from a log file.
      LogAnalyzer.count_lines_before:
        summary: Count lines before an offset for evidence line numbers.
      LogAnalyzer.handle_error_line:
        summary: Send one exact log error object to the messaging error tracker.
      LogAnalyzer.load_context:
        summary: Load nearby log lines around an error.
      LogAnalyzer.emit_background_event:
        summary: Emit one durable RuntimeEvent for the analyzer run.
      build_log_error_object:
        summary: Build the exact error object passed to the messaging bus.
      ensure_log_analyzer_running:
        summary: Ensure one analyzer thread is running for a project root.
      is_log_analyzer_running:
        summary: Check whether a project root has a live analyzer thread.
      stop_log_analyzer:
        summary: Stop analyzer threads for one root or all roots.
