version: 1.0.0
component: checkbox
extends: ./root.yaml
purpose: Binary choice control with visible label support

wrapper:
  layout:
    display: flex
    align_items: center
    gap_px: 10
  cursor: pointer

box:
  radius_px: 4
  border:
    width_px: 1
    color_token: border_strong
  background_token: surface_soft
  checked_background_token: accent
  checked_border_token: accent
  checkmark_color: "#f8f6f1"

sizes:
  small:
    box_px: 14
    title_font_px: 10
    helper_font_px: 8
  medium:
    box_px: 17
    title_font_px: 10
    helper_font_px: 8
  large:
    box_px: 20
    title_font_px: 10
    helper_font_px: 8

copy:
  title_weight: 700
  helper_color_token: text_faint
  helper_line_height: 1.4

agent_rules:
  always_pair_checkbox_with_text_label: true
  do_not_render_checkbox_without_click_target_padding: true
