version: 1.0.0
component: body
extends: ./root.yaml
purpose: Main page body, section shells, content grid, and panel composition

page_body:
  layout:
    display: grid
    gap_px: 16
    padding_desktop_px: 18
    padding_mobile_px: 10
  background:
    layers:
      - "radial-gradient(circle at top left, rgba(72, 103, 94, 0.07), transparent 26%)"
      - "linear-gradient(180deg, #f5f2ec 0%, #f1efe9 100%)"

section_shell:
  background: "rgba(248, 246, 241, 0.92)"
  border:
    width_px: 1
    color_token: border
  radius_px: 4
  shadow_token: panel
  padding_px: 16

section_head:
  layout:
    display: flex
    align_items: flex-end
    justify_content: space-between
    gap_px: 16
    mobile_direction: column
    mobile_align_items: flex-start
  title:
    font_size_px: 18
    line_height: 1.15
    color_token: text
  kicker:
    font_size_px: 8
    font_weight: 800
    tracking_em: 0.12
    text_transform: uppercase
    color_token: text_soft
  supporting_copy:
    font_size_px: 9
    line_height: 1.5
    color_token: text_soft
  meta:
    font_size_px: 8
    tracking_em: 0.08
    text_transform: uppercase
    color_token: text_faint

component_grid:
  desktop_columns: 3
  desktop_gap_px: 12
  mobile_columns: 1
  responsive_breakpoint_px: 980

sample_shell:
  padding_px: 14
  radius_px: 4
  border:
    width_px: 1
    color_token: border
  background: "linear-gradient(180deg, rgba(255, 255, 255, 0.36), rgba(236, 233, 226, 0.6))"

agent_rules:
  every_major_group_should_use_section_shell: true
  preserve_open_space: true
  do_not_stack_more_than_three_primary_sections_without_user_need: true
  do_not_remove_borders_and_replace_with_shadow_only: true
