version: 1.0.0
component: card
extends: ./root.yaml
purpose: Content, metric, and profile cards

shell:
  radius_px: 4
  border:
    width_px: 1
    color_token: border
  background: "rgba(248, 246, 241, 0.92)"
  shadow_token: card
  overflow: hidden

regions:
  header:
    padding_px: 12
    layout:
      display: flex
      align_items: flex-start
      justify_content: space-between
      gap_px: 10
    divider:
      width_px: 1
      color: "rgba(216, 211, 201, 0.75)"
  body:
    padding_px: 12
  footer:
    padding_px: 12
    layout:
      display: flex
      align_items: center
      justify_content: space-between
      gap_px: 10
    divider:
      width_px: 1
      color: "rgba(216, 211, 201, 0.75)"

text:
  kicker:
    font_size_px: 8
    font_weight: 800
    tracking_em: 0.08
    text_transform: uppercase
    color_token: text_faint
  title:
    font_size_px: 12
    font_weight: 700
    color_token: text
  body_copy:
    font_size_px: 9
    line_height: 1.5
    color_token: text_soft

agent_rules:
  use_card_when_content_needs_clear_grouping: true
  keep_card_content_concise: true
  do_not_add_large illustration blocks unless requested: true
