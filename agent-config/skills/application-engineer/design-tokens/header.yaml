version: 1.0.0
component: header
extends: ./root.yaml
purpose: Global application header / topbar

structure:
  required_regions:
    - brand
    - optional_status
    - optional_actions
  layout:
    display: flex
    align_items: center
    justify_content: space-between
    gap_px: 16
    min_height_px: 54
    padding_desktop: "0 18px"
    padding_mobile: "0 12px"

surface:
  background: "rgba(248, 246, 241, 0.94)"
  border_bottom:
    width_px: 1
    color_token: border
  radius_px: 0
  backdrop_filter: "blur(10px)"

brand:
  layout:
    display: flex
    align_items: center
    gap_px: 10
  mark:
    width_px: 28
    height_px: 28
    radius_px: 4
    background_token: text
    text_token: surface
    font_size_px: 9
    font_weight: 800
    letter_spacing_em: 0.08
  title:
    font_size_px: 11
    font_weight: 800
    letter_spacing_em: 0.08
    text_transform: uppercase
    color_token: text
  subtitle:
    font_size_px: 9
    color_token: text_faint

status:
  font_size_px: 9
  color_token: text_faint
  white_space: nowrap

agent_rules:
  do_not_make_header_tall: true
  do_not_add_large_navigation_blocks_unless_requested: true
  keep_brand_compact: true
  if_actions_exist_match_button_yaml: true
