[project]
name = "custom-agent-tools-and-runtime"
version = "0.1.0"
description = "Direct-folder custom agent tools and runtime extracted from the monorepo."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "PyYAML>=6",
  "playwright>=1.45",
  "uvicorn>=0.29",
]

[tool.custom-agent-tools-and-runtime]
state_root = ".agent-state"
workflow_yaml_root = "workflow/yamls"
default_workflow = "analysis"
