[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "monorepo-agent-gateway"
version = "0.1.0"
description = "Shared build/load/run gateway for monorepo agents"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "Jinja2>=3.1.4,<4",
]

[project.optional-dependencies]
codex = ["openai-codex"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]
