<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Builder</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #191b22; }
    header { height: 58px; background: #fff; border-bottom: 1px solid #dedfe4; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
    header strong { font-size: 15px; }
    header span { color: #686d78; font-size: 13px; }
    main { max-width: 1040px; margin: 34px auto; padding: 0 22px 56px; }
    .heading { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:18px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -0.02em; }
    .sub { margin: 7px 0 0; color:#696e78; font-size: 13px; }
    .layout { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(300px,.75fr); gap:18px; }
    .card { background:#fff; border:1px solid #dcdee4; border-radius:10px; padding:20px; box-shadow:0 1px 2px rgba(25,27,34,.03); }
    label { display:block; font-size:12px; font-weight:650; margin-bottom:7px; }
    .optional { color:#8b9099; font-weight:450; margin-left:5px; }
    input, textarea { width:100%; border:1px solid #cfd2d9; border-radius:6px; padding:10px 11px; font:inherit; font-size:13px; background:#fff; outline:none; }
    input:focus, textarea:focus { border-color:#747b88; box-shadow:0 0 0 3px rgba(90,97,110,.09); }
    textarea { min-height:92px; resize:vertical; }
    .field { margin-bottom:17px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .actions { display:flex; justify-content:flex-end; gap:9px; padding-top:4px; }
    button { border:1px solid #c8cbd2; background:#fff; border-radius:6px; padding:8px 13px; font:inherit; font-size:12px; font-weight:650; cursor:pointer; }
    button.primary { color:#fff; background:#20232a; border-color:#20232a; }
    button:hover { filter:brightness(.98); }
    pre { margin:0; background:#f7f8fa; border:1px solid #e2e4e9; border-radius:7px; padding:13px; min-height:320px; white-space:pre-wrap; word-break:break-word; font-size:11.5px; line-height:1.5; overflow:auto; }
    .status { margin-top:10px; min-height:18px; color:#5c626d; font-size:12px; }
    .status.error { color:#9b2c2c; }
    .status.success { color:#246b43; }
    .tiny { font-size:11px; color:#8a8f98; margin-top:8px; }
    @media (max-width: 820px) { .layout { grid-template-columns:1fr; } .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>Agent Builder</strong>
    <span>V1 · local monorepo</span>
  </header>
  <main>
    <div class="heading">
      <div><h1>Create an agent</h1><p class="sub">Start with the purpose. The builder creates the standard agent structure and runtime configuration.</p></div>
    </div>
    <div class="layout">
      <section class="card">
        <div class="row">
          <div class="field"><label for="name">Agent name</label><input id="name" value="aws-deployment" placeholder="e.g. aws-deployment" /></div>
          <div class="field"><label for="skills">Skills <span class="optional">comma separated</span></label><input id="skills" value="aws-cdk, iam-validation" placeholder="repository-navigation, ..." /></div>
        </div>
        <div class="field"><label for="purpose">Purpose</label><textarea id="purpose">Deploy and maintain AWS infrastructure safely with CDK.</textarea></div>
        <div class="field"><label for="context">Context</label><textarea id="context" placeholder="Project stack, important constraints, existing architecture...">The project provisions Lambda, API Gateway, DynamoDB and IAM through AWS CDK.</textarea></div>
        <div class="field"><label for="workflow">Preferred workflow <span class="optional">optional</span></label><input id="workflow" value="Validate AWS identity → inspect diff → deploy → verify" /></div>
        <div class="field"><label for="restrictions">Restrictions <span class="optional">one per line</span></label><textarea id="restrictions">Never deploy before validating AWS caller identity.
Do not broaden IAM permissions without explaining why.</textarea></div>
        <div class="actions">
          <button id="preview">Preview</button>
          <button class="primary" id="build">Build Agent</button>
        </div>
        <div id="status" class="status"></div>
        <div class="tiny">Preview works without a backend. Build calls <code>http://127.0.0.1:8000/v1/agents/build</code>.</div>
      </section>
      <aside class="card">
        <label>Request / result</label>
        <pre id="output">Press Preview to inspect the request.</pre>
      </aside>
    </div>
  </main>
<script>
  const $ = id => document.getElementById(id);
  const payload = () => ({
    name: $('name').value.trim(),
    purpose: $('purpose').value.trim(),
    context: $('context').value.trim(),
    preferred_workflow: $('workflow').value.trim() || null,
    required_skills: $('skills').value.split(',').map(x => x.trim()).filter(Boolean),
    restrictions: $('restrictions').value.split('\n').map(x => x.trim()).filter(Boolean),
    responsibilities: [],
    overwrite: false
  });
  const show = value => $('output').textContent = JSON.stringify(value, null, 2);
  $('preview').onclick = () => { show(payload()); $('status').className='status'; $('status').textContent='Local preview only — no files were written.'; };
  $('build').onclick = async () => {
    $('status').className='status'; $('status').textContent='Submitting build request…';
    try {
      const response = await fetch('http://127.0.0.1:8000/v1/agents/build', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload()) });
      const body = await response.json(); show(body);
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      $('status').className='status success'; $('status').textContent=`Created ${body.agent_id}.`;
    } catch (error) {
      $('status').className='status error'; $('status').textContent=`Build failed: ${error.message}`;
    }
  };
</script>
</body>
</html>
