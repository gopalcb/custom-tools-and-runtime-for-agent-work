[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "monorepo-agent-builder"
version = "0.1.0"
description = "Agent design and scaffolding service for the monorepo"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "Jinja2>=3.1.4,<4",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_builder"]
