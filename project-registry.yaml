version: 1
projects:
  agent-builder:
    disabled: false
    path: agents/agent-builder
    aliases:
      - builder
      - build agent
      - create agent
      - agent creation
      - agent builder
    description: >
      Builds, validates, scaffolds, and registers agents. Handles agent design,
      instructions, skills, runtime configuration, permissions, templates, and
      initial evaluation definitions.

  agent-ui-builder:
    disabled: false
    path: agents/agent-ui-builder
    aliases:
      - ui builder
      - agent ui
      - html mockup
      - interface mockup
      - frontend mockup
    description: >
      Builds user interfaces and visual prototypes for agent applications.
      V1 focuses on lightweight standalone HTML mockups for the Agent Builder.
