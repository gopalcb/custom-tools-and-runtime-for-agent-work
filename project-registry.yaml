version: 1

paths:
  agents: agent-config/agents
  skills: agent-config/skills
  workflows: agent-runtime/agent-monorepo/workflows/workflow-orchestrator.yaml
  workflow_steps: agent-runtime/agent-monorepo/workflows/workflow-steps.yaml
  state: .agent-state
  messaging: .agent-state/agents-messaging

runtime:
  default_agent: agent-monorepo
  default_workflow: default
  max_parallel_tasks: 5

codex:
  command: codex app-server
  supported_cli: ">=0.153.4,<0.155.0"
  working_directory: .
  approval_policy: never
  sandbox: workspace-write
  network_access: true
  writable_roots:
    - .

model_profiles:
  standard:
    model: gpt-5.5
    effort: medium

memory:
  enabled: true
  retrieval: true
  semantic_retrieval: false
  extraction: true
  strategy_feedback:
    enabled: true
    max_rework_cycles: 3
    feedback_timeout_seconds: 600

validation:
  typecheck: .venv/bin/python -m compileall agent-runtime/agent-monorepo agent-gateway agent-tools/internal-messaging agent-tools/ui-debugger agent-tools/strategy-feedback agent-config/agents/agent-implementation-planner agent-config/agents/agent-logs-analyzer
  tests: .venv/bin/python -m pytest -q
  agent: '.venv/bin/python -c "from agent_monorepo.registry import Registry; Registry(''.'')"'
